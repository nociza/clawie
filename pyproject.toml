[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawie"
version = "0.1.4"
description = "Local CLI control plane for provisioning, orchestrating, and monitoring AI agent fleets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Clawie Team" }]
dependencies = [
    # TOML parsing for provider channel discovery; stdlib tomllib exists on 3.11+.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
clawie = "clawie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawie*"]

[tool.pytest.ini_options]
pythonpath = ["."]
