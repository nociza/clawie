[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawie"
version = "0.1.2"
description = "CLI + TUI control plane for ZeroClaw provisioning and channel operations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clawie Team" }]
dependencies = []

[project.scripts]
clawie = "clawie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawie*"]

[tool.pytest.ini_options]
pythonpath = ["."]
