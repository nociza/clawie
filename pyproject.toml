[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawie"
version = "0.1.3"
description = "CLI + TUI control plane for ZeroClaw provisioning and channel operations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clawie Team" }]
dependencies = [
    # TOML parsing for provider channel discovery; stdlib tomllib exists on 3.11+.
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
clawie = "clawie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawie*"]

[tool.pytest.ini_options]
pythonpath = ["."]
