name: Publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.14"
          enable-cache: false
      - name: Require the release tag to match package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run python -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'];
          expected=f'v{version}'; actual=os.environ['RELEASE_TAG'];
          assert actual == expected, f'release tag {actual!r} must equal {expected!r}'"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run release test and quality gates
        run: |
          uv run pytest -q --cov=clawie --cov-report=term-missing --cov-fail-under=71
          uv run ruff check clawie tests scripts/production_verify_fixture.py
          uv run mypy clawie scripts/production_verify_fixture.py
          uv run bandit -q -r clawie scripts -ll
          uv audit --frozen
          uv lock --check
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke-test both release artifacts
        run: |
          uvx --from dist/clawie-*.whl clawie --version
          uvx --from dist/clawie-*.tar.gz clawie --version
      - name: Upload immutable artifacts for the isolated publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/clawie/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish artifacts to PyPI through short-lived OIDC credentials
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
